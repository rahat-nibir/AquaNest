name: aquanest
description: Smart IoT Aquarium Management & Monitoring Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.4

  # Gemini AI
  google_generative_ai: ^0.4.6

  # Networking
  http: ^1.2.2

  # Config / secrets
  flutter_dotenv: ^5.1.0

  # Utilities
  intl: ^0.19.0

  # Local push notifications for proactive feeding/water/AI-health alerts
  flutter_local_notifications: ^18.0.1

  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env